name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build --configuration Release --no-restore
      
    - name: Test
      run: dotnet test --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"
      
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.os }}
        path: '**/test-results.trx'
        
    - name: Pack NuGet
      if: matrix.os == 'ubuntu-latest'
      run: dotnet pack src/Hunspell/Hunspell.csproj --configuration Release --no-build --output ./artifacts
      
    - name: Upload artifacts
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: ./artifacts/*.nupkg

  verify-reference:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - name: Check out pinned Hunspell reference
      uses: actions/checkout@v4
      with:
        repository: hunspell/hunspell
        ref: 15faca15532b34db3106d50f162e5edc2503d6d6 # v1.7.6
        path: upstream-reference
    - name: Build the reference library
      run: >-
        g++ -std=c++14 -O2 -fPIC -DBUILDING_LIBHUNSPELL -shared
        upstream-reference/src/hunspell/*.cxx
        -o "$RUNNER_TEMP/libhunspell-reference.so"
    - name: Verify pinned parity expectations
      run: >-
        python3 tests/Hunspell.Tests/UpstreamParity/verify_reference.py
        --library "$RUNNER_TEMP/libhunspell-reference.so"
